<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏休みクエスト 〜4体の封印〜</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18, ReactDOM 18, Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Framer Motion & Lucide Icons (CDN) -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100">
  
  <!-- React アプリケーションの描画先 -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion, AnimatePresence } = window.Motion;

    // ==========================================
    // 0. アイコンコンポーネント (Lucide Icons 描画ヘルパー)
    // ==========================================
    function Icon({ name, size = 24, className = "" }) {
      const iconRef = React.useRef(null);
      
      useEffect(() => {
        if (iconRef.current) {
          iconRef.current.innerHTML = "";
          const iconElement = lucide.icons[name];
          if (iconElement) {
            const svg = lucide.createElement(iconElement);
            svg.setAttribute("width", size);
            svg.setAttribute("height", size);
            if (className) svg.setAttribute("class", className);
            iconRef.current.appendChild(svg);
          }
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    }

    // ==========================================
    // 1. 初期データ
    // ==========================================
    const INITIAL_QUESTS = {
      math: {
        id: 'math',
        name: '算数ドラゴン',
        emoji: '🐉',
        maxHp: 32,
        currentHp: 32,
        completedPages: { left: [], right: [] },
        color: 'from-blue-500 to-indigo-600',
      },
      japanese: {
        id: 'japanese',
        name: '国語フェニックス',
        emoji: '🔥',
        maxHp: 32,
        currentHp: 32,
        completedPages: { left: [], right: [] },
        color: 'from-red-500 to-rose-600',
      },
      science: {
        id: 'science',
        name: '理科ゴーレム',
        emoji: '🤖',
        maxHp: 8,
        currentHp: 8,
        completedPages: { left: [], right: [] },
        color: 'from-emerald-500 to-teal-600',
      },
      social: {
        id: 'social',
        name: '社会タートル',
        emoji: '🐢',
        maxHp: 8,
        currentHp: 8,
        completedPages: { left: [], right: [] },
        color: 'from-amber-500 to-orange-600',
      },
    };

    // ==========================================
    // 2. モンスターカード・コンポーネント
    // ==========================================
    function MonsterCard({ quest, onAttack }) {
      const hpPercentage = Math.max(0, (quest.currentHp / quest.maxHp) * 100);
      const isDead = quest.currentHp === 0;

      // ページボタン生成（理科・社会は4ページずつ、算数・国語は16ページずつ）
      const maxLeft = quest.maxHp === 8 ? 4 : 16;
      const maxRight = quest.maxHp === 8 ? 4 : 16;

      return (
        <div className="bg-slate-800 border-2 border-slate-700 rounded-2xl p-5 shadow-lg relative overflow-hidden">
          {/* 討伐済みのバッジ */}
          {isDead && (
            <div className="absolute top-4 right-4 bg-amber-400 text-slate-900 font-bold px-3 py-1 rounded-full text-xs shadow-md z-10 flex items-center gap-1">
              <Icon name="Award" size={14} /> 討伐完了!!
            </div>
          )}

          {/* ヘッダー情報 */}
          <div className="flex justify-between items-center mb-2">
            <h3 className="font-bold text-lg text-white flex items-center gap-2">
              <span className="text-2xl">{quest.emoji}</span> {quest.name}
            </h3>
            <span className="text-xs font-mono bg-slate-900 text-rose-400 font-bold px-3 py-1 rounded-full border border-slate-700">
              HP: {quest.currentHp} / {quest.maxHp}
            </span>
          </div>

          {/* HPゲージ */}
          <div className="w-full bg-slate-900 h-6 rounded-full overflow-hidden p-1 border border-slate-700 mb-5">
            <motion.div
              className={`h-full rounded-full bg-gradient-to-r ${quest.color}`}
              initial={{ width: '100%' }}
              animate={{ width: `${hpPercentage}%` }}
              transition={{ duration: 0.4, ease: 'easeOut' }}
            />
          </div>

          {/* 左ページ (①〜) */}
          <div className="mb-4">
            <p className="text-xs text-slate-400 mb-1.5 font-bold">左のページ (①〜)</p>
            <div className="flex flex-wrap gap-1.5">
              {Array.from({ length: maxLeft }, (_, i) => i + 1).map((page) => {
                const isDone = quest.completedPages.left.includes(page);
                return (
                  <motion.button
                    key={`left-${page}`}
                    whileTap={{ scale: 0.85 }}
                    onClick={() => onAttack(quest.id, 'left', page)}
                    disabled={isDone}
                    className={`w-8 h-8 rounded-lg font-bold text-xs transition-colors flex items-center justify-center ${
                      isDone
                        ? 'bg-slate-900 text-slate-600 line-through cursor-not-allowed border border-slate-800'
                        : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md cursor-pointer'
                    }`}
                  >
                    {page}
                  </motion.button>
                );
              })}
            </div>
          </div>

          {/* 右ページ (1〜) */}
          <div>
            <p className="text-xs text-slate-400 mb-1.5 font-bold">右のページ (1〜)</p>
            <div className="flex flex-wrap gap-1.5">
              {Array.from({ length: maxRight }, (_, i) => i + 1).map((page) => {
                const isDone = quest.completedPages.right.includes(page);
                return (
                  <motion.button
                    key={`right-${page}`}
                    whileTap={{ scale: 0.85 }}
                    onClick={() => onAttack(quest.id, 'right', page)}
                    disabled={isDone}
                    className={`w-8 h-8 rounded-lg font-bold text-xs transition-colors flex items-center justify-center ${
                      isDone
                        ? 'bg-slate-900 text-slate-600 line-through cursor-not-allowed border border-slate-800'
                        : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-md cursor-pointer'
                    }`}
                  >
                    {page}
                  </motion.button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. メイン画面・ロジック
    // ==========================================
    function App() {
      const [quests, setQuests] = useState(INITIAL_QUESTS);
      const [isLoaded, setIsLoaded] = useState(false);
      const [showAttackEffect, setShowAttackEffect] = useState(false);

      // 初回ロード時に LocalStorage からデータを取得
      useEffect(() => {
        const saved = localStorage.getItem('homework_quest_data');
        if (saved) {
          try {
            setQuests(JSON.parse(saved));
          } catch (e) {
            console.error('データの読み込みに失敗しました', e);
          }
        }
        setIsLoaded(true);
      }, []);

      // 状態が変わるたびに LocalStorage へ保存
      useEffect(() => {
        if (isLoaded) {
          localStorage.setItem('homework_quest_data', JSON.stringify(quests));
        }
      }, [quests, isLoaded]);

      // ワンタップ攻撃処理
      const handleAttack = (subject, type, page) => {
        setQuests((prev) => {
          const currentQuest = prev[subject];
          if (currentQuest.completedPages[type].includes(page)) return prev;

          // エフェクトを再生
          setShowAttackEffect(true);
          setTimeout(() => setShowAttackEffect(false), 500);

          const newCompleted = {
            ...currentQuest.completedPages,
            [type]: [...currentQuest.completedPages[type], page],
          };

          const newHp = Math.max(0, currentQuest.currentHp - 1);

          return {
            ...prev,
            [subject]: {
              ...currentQuest,
              currentHp: newHp,
              completedPages: newCompleted,
            },
          };
        });
      };

      // 全進捗リセット（確認つき）
      const handleReset = () => {
        if (window.confirm('最初からやり直しますか？（ここまでの攻撃記録が消えます）')) {
          setQuests(INITIAL_QUESTS);
          localStorage.removeItem('homework_quest_data');
        }
      };

      // 画面ロード中のちらつき防止
      if (!isLoaded) return null;

      // 全体の総HPと残りHPの計算
      const totalMaxHp = Object.values(quests).reduce((acc, q) => acc + q.maxHp, 0);
      const totalCurrentHp = Object.values(quests).reduce((acc, q) => acc + q.currentHp, 0);
      const totalDamage = totalMaxHp - totalCurrentHp;

      return (
        <main className="min-h-screen bg-slate-900 text-slate-100 pb-16">
          {/* 攻撃アニメーション演出 */}
          <AnimatePresence>
            {showAttackEffect && (
              <motion.div
                initial={{ opacity: 0, scale: 0.5 }}
                animate={{ opacity: 1, scale: 1.2 }}
                exit={{ opacity: 0 }}
                className="fixed inset-0 flex items-center justify-center pointer-events-none z-50"
              >
                <div className="text-yellow-400 font-extrabold text-5xl md:text-6xl drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] flex items-center gap-2">
                  <Icon name="Sword" size={48} /> 1 ダメージ!!
                </div>
              </motion.div>
            )}
          </AnimatePresence>

          {/* ヘッダー・全体ステータス */}
          <div className="bg-slate-800 border-b border-slate-700 py-6 px-4 mb-8">
            <div className="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-amber-500 flex items-center gap-2">
                  <span>⚔️</span> 夏休みクエスト 〜4体の封印〜
                </h1>
                <p className="text-xs text-slate-400 mt-1">
                  終わらせたページのボタンを押して、モンスターに攻撃を仕掛けよう！
                </p>
              </div>

              <div className="flex items-center gap-4 bg-slate-900 px-4 py-2 rounded-xl border border-slate-700">
                <div>
                  <div className="text-[10px] text-slate-400 font-bold uppercase">Total Damage</div>
                  <div className="text-lg font-black text-amber-400 font-mono">
                    {totalDamage} <span className="text-xs text-slate-500">/ {totalMaxHp} P</span>
                  </div>
                </div>
                <button
                  onClick={handleReset}
                  className="p-2 text-slate-500 hover:text-rose-400 transition-colors"
                  title="リセット"
                >
                  <Icon name="RotateCcw" size={18} />
                </button>
              </div>
            </div>
          </div>

          {/* モンスターカード一覧 grid */}
          <div className="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-6">
            <MonsterCard quest={quests.math} onAttack={handleAttack} />
            <MonsterCard quest={quests.japanese} onAttack={handleAttack} />
            <MonsterCard quest={quests.science} onAttack={handleAttack} />
            <MonsterCard quest={quests.social} onAttack={handleAttack} />
          </div>
        </main>
      );
    }

    // DOMへのマウント
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
