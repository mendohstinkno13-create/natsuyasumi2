<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パーフェクト夏 120%進捗チェック</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18, ReactDOM 18, Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Framer Motion & Lucide Icons & Confetti (CDN) -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 selection:bg-blue-100">
  
  <!-- React アプリケーションの描画先 -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { motion, AnimatePresence } = window.Motion;

    // ==========================================
    // 0. アイコンヘルパー & 軽量効果音 (Web Audio API)
    // ==========================================
    function Icon({ name, size = 20, className = "" }) {
      const iconRef = React.useRef(null);
      useEffect(() => {
        if (iconRef.current) {
          iconRef.current.innerHTML = "";
          const iconElement = lucide.icons[name];
          if (iconElement) {
            const svg = lucide.createElement(iconElement);
            svg.setAttribute("width", size);
            svg.setAttribute("height", size);
            if (className) svg.setAttribute("class", className);
            iconRef.current.appendChild(svg);
          }
        }
      }, [name, size, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    }

    // 効果音再生ユーティリティ (外部ファイル不要)
    const playSound = (type = 'click', enabled = true) => {
      if (!enabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08); // A5
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'complete') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
          osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3); // C6
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        }
      } catch (e) {
        // AudioContext非対応環境のフォールバック
      }
    };

    // ==========================================
    // 1. 初期データ定義
    // ==========================================
    const INITIAL_SUBJECTS = {
      math: {
        id: 'math',
        name: '算数',
        totalPages: 32,
        completedPages: { left: [], right: [] },
        color: {
          bar: 'bg-blue-500',
          badge: 'bg-blue-100 text-blue-800 border-blue-200',
          button: 'bg-blue-600 hover:bg-blue-500 text-white',
        },
      },
      japanese: {
        id: 'japanese',
        name: '国語',
        totalPages: 32,
        completedPages: { left: [], right: [] },
        color: {
          bar: 'bg-rose-500',
          badge: 'bg-rose-100 text-rose-800 border-rose-200',
          button: 'bg-rose-600 hover:bg-rose-500 text-white',
        },
      },
      science: {
        id: 'science',
        name: '理科',
        totalPages: 8,
        completedPages: { left: [], right: [] },
        color: {
          bar: 'bg-emerald-500',
          badge: 'bg-emerald-100 text-emerald-800 border-emerald-200',
          button: 'bg-emerald-600 hover:bg-emerald-500 text-white',
        },
      },
      social: {
        id: 'social',
        name: '社会',
        totalPages: 8,
        completedPages: { left: [], right: [] },
        color: {
          bar: 'bg-amber-500',
          badge: 'bg-amber-100 text-amber-800 border-amber-200',
          button: 'bg-amber-600 hover:bg-amber-500 text-white',
        },
      },
    };

    const INITIAL_SUB_TASKS = {
      artProject: {
        title: '一人一作品（工作・自由研究など）',
        steps: [
          { id: 'theme', label: 'テーマと作品番号を決める', done: false },
          { id: 'prepare', label: '材料や道具をそろえる', done: false },
          { id: 'create', label: '作品を作る・まとめる', done: false },
          { id: 'card', label: '作品カードにふりかえりを書いて貼る', done: false },
        ]
      },
      books: [
        { id: 1, title: '', done: false },
        { id: 2, title: '', done: false },
        { id: 3, title: '', done: false },
        { id: 4, title: '', done: false },
        { id: 5, title: '', done: false },
      ],
      dailyHabits: {
        ondokuCount: 0,
        helpCount: 0,
      }
    };

    // ==========================================
    // 2. ペースメーカー判定ロジック
    // ==========================================
    function getPacerStatus(completedPages, totalPages = 80, deadlineStr = "2026-08-25") {
      const today = new Date();
      const startDate = new Date(today.getFullYear(), 6, 21); // 7月21日頃を夏休み開始と仮定
      const endDate = new Date(deadlineStr);
      
      const totalDays = Math.max(1, Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)));
      const passedDays = Math.max(0, Math.ceil((today - startDate) / (1000 * 60 * 60 * 24)));
      
      // 今日の理想達成ページ数
      const targetPagesToday = Math.min(totalPages, Math.round((totalPages / totalDays) * passedDays));
      const diff = completedPages - targetPagesToday;

      if (completedPages === totalPages) {
        return { status: "complete", text: "全課題クリア！最高の夏休み！", color: "bg-emerald-50 text-emerald-700 border-emerald-200" };
      } else if (diff >= 0) {
        return { status: "good", text: `順調！理想ペースより ${diff} ページリード中`, color: "bg-blue-50 text-blue-700 border-blue-200" };
      } else if (diff >= -5) {
        return { status: "warning", text: `ほぼ定刻！あと ${Math.abs(diff)} ページで理想ペース`, color: "bg-amber-50 text-amber-700 border-amber-200" };
      } else {
        return { status: "danger", text: `目標まであと ${Math.abs(diff)} ページ！少しペースアップしよう`, color: "bg-rose-50 text-rose-700 border-rose-200" };
      }
    }

    // ==========================================
    // 3. 教科別カードコンポーネント (ドリル)
    // ==========================================
    function SubjectCard({ data, onTogglePage, soundEnabled }) {
      const completedCount = data.completedPages.left.length + data.completedPages.right.length;
      const progressPercentage = Math.round((completedCount / data.totalPages) * 100);
      const isCompleted = completedCount === data.totalPages;

      const maxLeft = data.totalPages === 8 ? 4 : 16;
      const maxRight = data.totalPages === 8 ? 4 : 16;

      return (
        <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow">
          <div className="flex justify-between items-center mb-3">
            <div className="flex items-center gap-2">
              <h3 className="font-bold text-lg text-slate-800">{data.name}</h3>
              <span className={`text-xs px-2.5 py-0.5 rounded-full border font-medium ${data.color.badge}`}>
                {completedCount} / {data.totalPages} ページ
              </span>
            </div>
            {isCompleted && (
              <span className="flex items-center gap-1 text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                <Icon name="CheckCircle2" size={14} /> 完了
              </span>
            )}
          </div>

          <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden mb-5">
            <motion.div
              className={`h-full rounded-full ${data.color.bar}`}
              initial={{ width: '0%' }}
              animate={{ width: `${progressPercentage}%` }}
              transition={{ duration: 0.3, ease: 'easeOut' }}
            />
          </div>

          <div className="mb-4">
            <p className="text-xs text-slate-500 mb-1.5 font-medium">左のページ（①〜）</p>
            <div className="flex flex-wrap gap-1.5">
              {Array.from({ length: maxLeft }, (_, i) => i + 1).map((page) => {
                const isDone = data.completedPages.left.includes(page);
                return (
                  <button
                    key={`left-${page}`}
                    onClick={() => {
                      playSound('click', soundEnabled);
                      onTogglePage(data.id, 'left', page);
                    }}
                    className={`w-8 h-8 rounded-lg font-bold text-xs transition-all flex items-center justify-center ${
                      isDone
                        ? 'bg-slate-100 text-slate-400 line-through border border-slate-200'
                        : `${data.color.button} shadow-sm active:scale-95`
                    }`}
                  >
                    {page}
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <p className="text-xs text-slate-500 mb-1.5 font-medium">右のページ（1〜）</p>
            <div className="flex flex-wrap gap-1.5">
              {Array.from({ length: maxRight }, (_, i) => i + 1).map((page) => {
                const isDone = data.completedPages.right.includes(page);
                return (
                  <button
                    key={`right-${page}`}
                    onClick={() => {
                      playSound('click', soundEnabled);
                      onTogglePage(data.id, 'right', page);
                    }}
                    className={`w-8 h-8 rounded-lg font-bold text-xs transition-all flex items-center justify-center ${
                      isDone
                        ? 'bg-slate-100 text-slate-400 line-through border border-slate-200'
                        : `${data.color.button} shadow-sm active:scale-95`
                    }`}
                  >
                    {page}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. サブ課題コンポーネント (工作・読書・日課)
    // ==========================================
    function SubTasksPanel({ subTasks, setSubTasks, soundEnabled }) {
      const toggleArtStep = (index) => {
        playSound('click', soundEnabled);
        setSubTasks(prev => {
          const newSteps = [...prev.artProject.steps];
          newSteps[index].done = !newSteps[index].done;
          return { ...prev, artProject: { ...prev.artProject, steps: newSteps } };
        });
      };

      const updateBook = (id, field, value) => {
        if (field === 'done') playSound('click', soundEnabled);
        setSubTasks(prev => ({
          ...prev,
          books: prev.books.map(b => b.id === id ? { ...b, [field]: value } : b)
        }));
      };

      const incrementHabit = (key) => {
        playSound('click', soundEnabled);
        setSubTasks(prev => ({
          ...prev,
          dailyHabits: { ...prev.dailyHabits, [key]: prev.dailyHabits[key] + 1 }
        }));
      };

      return (
        <div className="space-y-6">
          {/* 一人一作品 */}
          <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
            <h3 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
              <Icon name="Palette" className="text-amber-500" />
              ② 一人一作品（自由研究・工作）
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {subTasks.artProject.steps.map((step, idx) => (
                <label
                  key={step.id}
                  className={`flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition-colors ${
                    step.done ? 'bg-amber-50/50 border-amber-200 text-slate-500 line-through' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-800'
                  }`}
                >
                  <input
                    type="checkbox"
                    checked={step.done}
                    onChange={() => toggleArtStep(idx)}
                    className="w-5 h-5 rounded text-amber-500 focus:ring-amber-400"
                  />
                  <span className="text-sm font-medium">{step.label}</span>
                </label>
              ))}
            </div>
          </div>

          {/* 読書 5冊以上 */}
          <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
            <h3 className="font-bold text-lg text-slate-800 mb-1 flex items-center gap-2">
              <Icon name="BookOpenCheck" className="text-blue-500" />
              ③ 読書・5さつ以上（目標リスト）
            </h3>
            <p className="text-xs text-slate-500 mb-4">読んだ本のタイトルを書き留めて、チェックをつけよう！</p>
            <div className="space-y-3">
              {subTasks.books.map((book, idx) => (
                <div key={book.id} className="flex items-center gap-3">
                  <span className="text-xs font-bold text-slate-400 w-5">{idx + 1}.</span>
                  <input
                    type="checkbox"
                    checked={book.done}
                    onChange={(e) => updateBook(book.id, 'done', e.target.checked)}
                    className="w-5 h-5 rounded text-blue-600 focus:ring-blue-500 cursor-pointer"
                  />
                  <input
                    type="text"
                    value={book.title}
                    onChange={(e) => updateBook(book.id, 'title', e.target.value)}
                    placeholder={`読んだ本のタイトル (${idx + 1}冊目)`}
                    className={`flex-1 text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-blue-500 transition-colors ${
                      book.done ? 'line-through text-slate-400 bg-slate-100/50' : 'text-slate-800'
                    }`}
                  />
                </div>
              ))}
            </div>
          </div>

          {/* 音読・家のお手伝い */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex items-center justify-between">
              <div>
                <h3 className="font-bold text-slate-800 flex items-center gap-2 mb-1">
                  <Icon name="Sparkles" className="text-indigo-500" />
                  ④ 音読（百人一首など）
                </h3>
                <p className="text-xs text-slate-500">練習した回数をカウント！</p>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-2xl font-black text-indigo-600 font-mono">{subTasks.dailyHabits.ondokuCount}</span>
                <span className="text-xs text-slate-400">回</span>
                <button
                  onClick={() => incrementHabit('ondokuCount')}
                  className="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold px-4 py-2 rounded-xl text-sm border border-indigo-200 active:scale-95 transition-all"
                >
                  +1 回記録
                </button>
              </div>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex items-center justify-between">
              <div>
                <h3 className="font-bold text-slate-800 flex items-center gap-2 mb-1">
                  <Icon name="HeartHandshake" className="text-rose-500" />
                  ⑤ 家のお手伝い
                </h3>
                <p className="text-xs text-slate-500">お手伝いできた日数・回数</p>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-2xl font-black text-rose-600 font-mono">{subTasks.dailyHabits.helpCount}</span>
                <span className="text-xs text-slate-400">回</span>
                <button
                  onClick={() => incrementHabit('helpCount')}
                  className="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-4 py-2 rounded-xl text-sm border border-rose-200 active:scale-95 transition-all"
                >
                  +1 回記録
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. メインアプリケーション
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('drill'); // 'drill' or 'subtasks'
      const [subjects, setSubjects] = useState(INITIAL_SUBJECTS);
      const [subTasks, setSubTasks] = useState(INITIAL_SUB_TASKS);
      const [reward, setReward] = useState('宿題が終わったら家族でアイスを食べる！');
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showSettings, setShowSettings] = useState(false);
      const [isLoaded, setIsLoaded] = useState(false);

      // LocalStorage から読み込み
      useEffect(() => {
        const savedDrill = localStorage.getItem('hw120_subjects');
        const savedSub = localStorage.getItem('hw120_subtasks');
        const savedReward = localStorage.getItem('hw120_reward');
        const savedSound = localStorage.getItem('hw120_sound');

        if (savedDrill) try { setSubjects(JSON.parse(savedDrill)); } catch (e) {}
        if (savedSub) try { setSubTasks(JSON.parse(savedSub)); } catch (e) {}
        if (savedReward) setReward(savedReward);
        if (savedSound !== null) setSoundEnabled(savedSound === 'true');

        setIsLoaded(true);
      }, []);

      // LocalStorage に保存
      useEffect(() => {
        if (!isLoaded) return;
        localStorage.setItem('hw120_subjects', JSON.stringify(subjects));
        localStorage.setItem('hw120_subtasks', JSON.stringify(subTasks));
        localStorage.setItem('hw120_reward', reward);
        localStorage.setItem('hw120_sound', String(soundEnabled));
      }, [subjects, subTasks, reward, soundEnabled, isLoaded]);

      // ドリル全完了で紙吹雪＆効果音
      const totalPages = useMemo(() => Object.values(subjects).reduce((acc, s) => acc + s.totalPages, 0), [subjects]);
      const completedPages = useMemo(() => {
        return Object.values(subjects).reduce((acc, s) => acc + s.completedPages.left.length + s.completedPages.right.length, 0);
      }, [subjects]);
      const totalPercentage = Math.round((completedPages / totalPages) * 100);

      useEffect(() => {
        if (isLoaded && totalPercentage === 100) {
          playSound('complete', soundEnabled);
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
        }
      }, [totalPercentage, isLoaded]);

      // ページの完了/未完了を切り替え
      const handleTogglePage = (subject, type, page) => {
        setSubjects((prev) => {
          const currentSubject = prev[subject];
          const isAlreadyDone = currentSubject.completedPages[type].includes(page);
          const updatedPages = isAlreadyDone
            ? currentSubject.completedPages[type].filter((p) => p !== page)
            : [...currentSubject.completedPages[type], page];

          return {
            ...prev,
            [subject]: {
              ...currentSubject,
              completedPages: {
                ...currentSubject.completedPages,
                [type]: updatedPages,
              },
            },
          };
        });
      };

      // 全リセット
      const handleReset = () => {
        if (window.confirm('チェックや記録をすべてリセットしますか？')) {
          setSubjects(INITIAL_SUBJECTS);
          setSubTasks(INITIAL_SUB_TASKS);
          localStorage.removeItem('hw120_subjects');
          localStorage.removeItem('hw120_subtasks');
          setShowSettings(false);
        }
      };

      // データ引き継ぎ (エクスポート・インポート)
      const handleExport = () => {
        const dataStr = JSON.stringify({ subjects, subTasks, reward });
        navigator.clipboard.writeText(dataStr);
        alert('データをクリップボードにコピーしました！他の端末でインポートできます。');
      };

      const handleImport = () => {
        const input = prompt('保存したバックアップ文字列を貼り付けてください:');
        if (input) {
          try {
            const parsed = JSON.parse(input);
            if (parsed.subjects) setSubjects(parsed.subjects);
            if (parsed.subTasks) setSubTasks(parsed.subTasks);
            if (parsed.reward) setReward(parsed.reward);
            alert('データを復元しました！');
            setShowSettings(false);
          } catch (e) {
            alert('データの形式が正しくありません。');
          }
        }
      };

      if (!isLoaded) return null;

      const pacer = getPacerStatus(completedPages, totalPages);

      return (
        <main className="min-h-screen bg-slate-50 text-slate-800 pb-20">
          {/* ヘッダー */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-4xl mx-auto py-4 px-4 flex justify-between items-center">
              <div className="flex items-center gap-2">
                <span className="bg-blue-600 text-white p-2 rounded-xl flex items-center justify-center shadow-xs">
                  <Icon name="BookOpen" size={20} />
                </span>
                <div>
                  <h1 className="text-lg font-extrabold text-slate-800 leading-tight">
                    パーフェクト夏 進捗チェック
                  </h1>
                  <p className="text-[11px] text-slate-500">夏の課題を全クリアして達成感を味わおう！</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  className={`p-2 rounded-xl border text-sm transition-colors ${
                    soundEnabled ? 'bg-slate-100 border-slate-300 text-slate-700' : 'bg-slate-50 border-slate-200 text-slate-400'
                  }`}
                  title={soundEnabled ? "効果音: ON" : "効果音: OFF"}
                >
                  <Icon name={soundEnabled ? "Volume2" : "VolumeX"} size={18} />
                </button>
                <button
                  onClick={() => setShowSettings(!showSettings)}
                  className="p-2 rounded-xl border bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100"
                  title="メニュー"
                >
                  <Icon name="Settings" size={18} />
                </button>
              </div>
            </div>
          </header>

          {/* 設定・メニューモーダル */}
          {showSettings && (
            <div className="max-w-4xl mx-auto px-4 mt-3">
              <div className="bg-slate-800 text-white rounded-2xl p-4 shadow-lg flex flex-wrap items-center justify-between gap-3 text-xs">
                <div className="flex items-center gap-2">
                  <Icon name="Database" size={16} className="text-blue-400" />
                  <span>端末間での引き継ぎ・バックアップ</span>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={handleExport} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600">
                    データをコピー
                  </button>
                  <button onClick={handleImport} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600">
                    データを復元
                  </button>
                  <button onClick={handleReset} className="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg font-bold ml-2">
                    初期化
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="max-w-4xl mx-auto px-4 mt-6 space-y-6">
            {/* 1. ご褒美（モチベーション）バナー */}
            <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl p-4 shadow-sm flex items-center gap-3">
              <span className="text-2xl">🎁</span>
              <div className="flex-1">
                <span className="text-[10px] uppercase font-bold tracking-wider opacity-80 block">
                  クリア時のご褒美目標
                </span>
                <input
                  type="text"
                  value={reward}
                  onChange={(e) => setReward(e.target.value)}
                  className="w-full bg-transparent font-bold text-sm md:text-base border-b border-white/40 focus:border-white focus:outline-none placeholder:text-white/60 py-0.5"
                  placeholder="例：宿題が終わったらアイスを買ってもらう！"
                />
              </div>
            </div>

            {/* 2. 全体進捗＆ペースメーカーパネル */}
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
              <div className="flex justify-between items-end mb-2">
                <div>
                  <span className="text-xs font-semibold text-slate-400 block uppercase tracking-wider">
                    Total Progress (①パーフェクト夏)
                  </span>
                  <span className="text-2xl font-black text-slate-800">
                    {completedPages}{' '}
                    <span className="text-sm font-normal text-slate-500">
                      / {totalPages} ページ完了
                    </span>
                  </span>
                </div>
                <div className="text-2xl font-black text-blue-600">
                  {totalPercentage}%
                </div>
              </div>

              {/* 全体プログレスバー */}
              <div className="w-full bg-slate-100 h-4 rounded-full overflow-hidden mb-4">
                <motion.div
                  className="h-full bg-blue-600 rounded-full"
                  initial={{ width: '0%' }}
                  animate={{ width: `${totalPercentage}%` }}
                  transition={{ duration: 0.4, ease: 'easeOut' }}
                />
              </div>

              {/* 逆算ペースメーカーガイダンス */}
              <div className={`text-xs px-3.5 py-2.5 rounded-xl border font-medium flex items-center justify-between ${pacer.color}`}>
                <span className="flex items-center gap-2">
                  <Icon name="Calendar" size={16} />
                  {pacer.text}
                </span>
                <span className="text-[11px] opacity-80 font-mono">提出日: 8/25</span>
              </div>
            </div>

            {/* 3. タブ切り替えボタン */}
            <div className="flex border-b border-slate-200">
              <button
                onClick={() => { playSound('click', soundEnabled); setActiveTab('drill'); }}
                className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 border-b-2 transition-colors ${
                  activeTab === 'drill'
                    ? 'border-blue-600 text-blue-600'
                    : 'border-transparent text-slate-400 hover:text-slate-600'
                }`}
              >
                <Icon name="BookOpen" size={18} />
                ① ドリル（パーフェクト夏）
              </button>
              <button
                onClick={() => { playSound('click', soundEnabled); setActiveTab('subtasks'); }}
                className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 border-b-2 transition-colors ${
                  activeTab === 'subtasks'
                    ? 'border-blue-600 text-blue-600'
                    : 'border-transparent text-slate-400 hover:text-slate-600'
                }`}
              >
                <Icon name="ListTodo" size={18} />
                ②〜⑤ その他の課題（工作・読書・お手伝い）
              </button>
            </div>

            {/* 4. タブ中身表示 */}
            {activeTab === 'drill' ? (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <SubjectCard data={subjects.math} onTogglePage={handleTogglePage} soundEnabled={soundEnabled} />
                <SubjectCard data={subjects.japanese} onTogglePage={handleTogglePage} soundEnabled={soundEnabled} />
                <SubjectCard data={subjects.science} onTogglePage={handleTogglePage} soundEnabled={soundEnabled} />
                <SubjectCard data={subjects.social} onTogglePage={handleTogglePage} soundEnabled={soundEnabled} />
              </div>
            ) : (
              <SubTasksPanel subTasks={subTasks} setSubTasks={setSubTasks} soundEnabled={soundEnabled} />
            )}
          </div>
        </main>
      );
    }

    // DOMへのマウント
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
