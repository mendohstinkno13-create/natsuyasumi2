<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>夏休み宿題進捗チェック</title>
  
  <!-- スマートな日本語フォント (Zen Kaku Gothic New) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Zen Kaku Gothic New"', 'sans-serif'] },
          boxShadow: { 'soft': '0 10px 40px -10px rgba(0,0,0,0.08)' }
        }
      }
    }
  </script>
  
  <!-- React 18, ReactDOM 18, Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Framer Motion & Lucide Icons & Confetti (CDN) -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    /* ドラッグ中のテキスト選択やスクロールを防止 */
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #f8fafc;
    }
    .page-btn { transition: background-color 0.15s ease, transform 0.1s ease; }
    .page-btn:active { transform: scale(0.9); }
  </style>
</head>
<body class="text-slate-700 selection:bg-indigo-100">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const { motion, AnimatePresence } = window.Motion;

    // ==========================================
    // 0. 共通ツール（アイコン・効果音・花火・カレンダー日付）
    // ==========================================
    function Icon({ name, size = 20, className = "" }) {
      const iconRef = React.useRef(null);
      useEffect(() => {
        if (iconRef.current) {
          iconRef.current.innerHTML = "";
          const iconElement = lucide.icons[name];
          if (iconElement) {
            const svg = lucide.createElement(iconElement);
            svg.setAttribute("width", size); svg.setAttribute("height", size);
            if (className) svg.setAttribute("class", className);
            iconRef.current.appendChild(svg);
          }
        }
      }, [name, size, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
    }

    const playSound = (type = 'click', enabled = true) => {
      if (!enabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.start(); osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'fireworks') {
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.5);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.start(); osc.stop(ctx.currentTime + 0.5);
        }
      } catch (e) {}
    };

    const launchFireworks = () => {
      const duration = 5 * 1000; const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };
      const randomInRange = (min, max) => Math.random() * (max - min) + min;
      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    };

    const summerDates = [];
    for (let d = new Date(2026, 6, 21); d <= new Date(2026, 7, 31); d.setDate(d.getDate() + 1)) {
      summerDates.push(new Date(d));
    }

    // ==========================================
    // 1. データ定義＆ペースメーカー計算
    // ==========================================
    const INITIAL_SUBJECTS = {
      math: { id: 'math', name: '算数', totalPages: 32, completedPages: { left: [], right: [] }, color: 'indigo' },
      japanese: { id: 'japanese', name: '国語', totalPages: 32, completedPages: { left: [], right: [] }, color: 'rose' },
      science: { id: 'science', name: '理科', totalPages: 8, completedPages: { left: [], right: [] }, color: 'teal' },
      social: { id: 'social', name: '社会', totalPages: 8, completedPages: { left: [], right: [] }, color: 'amber' },
    };

    const INITIAL_SUB_TASKS = {
      artProject: {
        steps: [
          { id: 'theme', label: 'テーマと作品番号を決める', done: false },
          { id: 'prepare', label: '材料や道具をそろえる', done: false },
          { id: 'create', label: '作品を作る・まとめる', done: false },
          { id: 'card', label: '作品カードにふりかえりを書いて貼る', done: false },
        ]
      },
      books: [{ id: 1, title: '', done: false }],
      dailyHabits: { ondoku: [], help: [] }
    };

    const getPacerStatus = (completedPages, totalPages = 80) => {
      const today = new Date();
      const startDate = new Date(today.getFullYear(), 6, 21); // 7/21
      const endDate = new Date(today.getFullYear(), 7, 25); // 8/25
      const totalDays = Math.max(1, Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)));
      const passedDays = Math.max(0, Math.ceil((today - startDate) / (1000 * 60 * 60 * 24)));
      const targetPagesToday = Math.min(totalPages, Math.round((totalPages / totalDays) * passedDays));
      const diff = completedPages - targetPagesToday;

      let color = "text-emerald-600 bg-emerald-50 border-emerald-200";
      let text = "全課題クリア！最高の夏休み！";
      if (completedPages < totalPages) {
        if (diff >= 0) { color = "text-blue-600 bg-blue-50 border-blue-200"; text = `順調！理想より ${diff} ページリード`; }
        else if (diff >= -5) { color = "text-amber-600 bg-amber-50 border-amber-200"; text = `ほぼ定刻。あと ${Math.abs(diff)} ページで理想ペース`; }
        else { color = "text-rose-600 bg-rose-50 border-rose-200"; text = `目標まであと ${Math.abs(diff)} ページ。ペースアップ！`; }
      }
      return { targetPagesToday, isQuotaMet: completedPages >= targetPagesToday && targetPagesToday > 0, diff, text, color };
    };

    // 丸数字への変換用配列
    const CIRCLE_NUMBERS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯'];

    // ==========================================
    // 2. 教科カードコンポーネント (丸数字・通常数字両対応、ラベルなし)
    // ==========================================
    function SubjectCard({ data, isDragging, setIsDragging, onTogglePage, onSetPageStatus, soundEnabled }) {
      const completedCount = data.completedPages.left.length + data.completedPages.right.length;
      const progressPercentage = Math.round((completedCount / data.totalPages) * 100);
      const isCompleted = completedCount === data.totalPages;

      const colors = {
        indigo: { bg: 'bg-indigo-50', text: 'text-indigo-700', bar: 'bg-indigo-500', btn: 'bg-indigo-500 shadow-indigo-200 text-white' },
        rose: { bg: 'bg-rose-50', text: 'text-rose-700', bar: 'bg-rose-500', btn: 'bg-rose-500 shadow-rose-200 text-white' },
        teal: { bg: 'bg-teal-50', text: 'text-teal-700', bar: 'bg-teal-500', btn: 'bg-teal-500 shadow-teal-200 text-white' },
        amber: { bg: 'bg-amber-50', text: 'text-amber-700', bar: 'bg-amber-500', btn: 'bg-amber-500 shadow-amber-200 text-white' },
      }[data.color];

      const renderButtons = (type, max) => {
        return Array.from({ length: max }, (_, i) => i + 1).map((page) => {
          const isDone = data.completedPages[type].includes(page);
          const displayNum = type === 'left' ? (CIRCLE_NUMBERS[page - 1] || page) : page;
          return (
            <button
              key={`${type}-${page}`} data-subject={data.id} data-type={type} data-page={page}
              className={`page-btn w-9 h-9 rounded-xl font-bold text-[13px] flex items-center justify-center border shadow-sm ${
                isDone ? `${colors.btn} border-transparent` : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'
              }`}
              // 修正ポイント：onClickに統一し、onTouchStartを削除しました
              onClick={() => { 
                playSound('click', soundEnabled); 
                onTogglePage(data.id, type, page); 
              }}
              onMouseDown={() => setIsDragging(true)}
              onMouseEnter={() => { 
                if (isDragging && !isDone) { 
                  playSound('click', soundEnabled); 
                  onSetPageStatus(data.id, type, page, true); 
                } 
              }}
            >
              {displayNum}
            </button>
          );
        });
      };

      return (
        <div className="bg-white/80 backdrop-blur-xl border border-white rounded-3xl p-6 shadow-soft transition-all">
          <div className="flex justify-between items-center mb-4">
            <h3 className="font-extrabold text-lg tracking-wide text-slate-800">{data.name}</h3>
            {isCompleted ? (
              <span className={`text-xs px-3 py-1 rounded-full font-bold flex items-center gap-1 ${colors.bg} ${colors.text}`}>
                <Icon name="Check" size={14} /> 完了
              </span>
            ) : (
              <span className="text-xs font-semibold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">{completedCount} / {data.totalPages}</span>
            )}
          </div>
          <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-6">
            <motion.div className={`h-full rounded-full ${colors.bar}`} initial={{ width: '0%' }} animate={{ width: `${progressPercentage}%` }} transition={{ duration: 0.4, ease: 'easeOut' }} />
          </div>
          
          <div className="mb-3">
            <div className="flex flex-wrap gap-2">{renderButtons('left', data.totalPages === 8 ? 4 : 16)}</div>
          </div>
          <div>
            <div className="flex flex-wrap gap-2">{renderButtons('right', data.totalPages === 8 ? 4 : 16)}</div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. サブ課題コンポーネント
    // ==========================================
    function SubTasksPanel({ subTasks, setSubTasks, soundEnabled }) {
      const toggleArtStep = (index) => {
        playSound('click', soundEnabled);
        setSubTasks(prev => {
          const newSteps = [...prev.artProject.steps];
          newSteps[index].done = !newSteps[index].done;
          return { ...prev, artProject: { ...prev.artProject, steps: newSteps } };
        });
      };
      
      const updateBook = (id, field, value) => {
        if (field === 'done') playSound('click', soundEnabled);
        setSubTasks(prev => ({ ...prev, books: prev.books.map(b => b.id === id ? { ...b, [field]: value } : b) }));
      };

      const addBook = () => {
        playSound('click', soundEnabled);
        setSubTasks(prev => ({
          ...prev, books: [...prev.books, { id: Date.now(), title: '', done: false }]
        }));
      };

      const removeBook = (id) => {
        setSubTasks(prev => ({ ...prev, books: prev.books.filter(b => b.id !== id) }));
      };

      const toggleHabit = (type, dateStr) => {
        playSound('click', soundEnabled);
        setSubTasks(prev => {
          const current = prev.dailyHabits[type] || [];
          const updated = current.includes(dateStr) ? current.filter(d => d !== dateStr) : [...current, dateStr];
          return { ...prev, dailyHabits: { ...prev.dailyHabits, [type]: updated } };
        });
      };

      const renderCalendar = (title, icon, colorTheme, type) => {
        const theme = {
          indigo: { bg: 'bg-indigo-50', text: 'text-indigo-600', active: 'bg-indigo-500 text-white shadow-sm ring-2 ring-indigo-200' },
          rose: { bg: 'bg-rose-50', text: 'text-rose-600', active: 'bg-rose-500 text-white shadow-sm ring-2 ring-rose-200' }
        }[colorTheme];

        return (
          <div className="bg-white/80 backdrop-blur-xl border border-white rounded-3xl p-6 shadow-soft">
            <div className="flex justify-between items-center mb-5">
              <h3 className="font-extrabold text-slate-800 flex items-center gap-2">
                <span className={`${theme.text} ${theme.bg} p-2 rounded-xl`}><Icon name={icon} size={18} /></span>
                {title}
              </h3>
              <div className="text-2xl font-black text-slate-700">
                {(subTasks.dailyHabits[type] || []).length} <span className="text-xs font-bold text-slate-400">日完了</span>
              </div>
            </div>
            
            <div className="grid grid-cols-7 gap-y-2 gap-x-1 text-center">
              {['日','月','火','水','木','金','土'].map(d => <div key={d} className="text-[10px] text-slate-400 font-bold mb-1">{d}</div>)}
              {Array.from({length: new Date(2026, 6, 21).getDay()}).map((_,i) => <div key={`empty-${i}`}/>)}
              
              {summerDates.map(date => {
                const dateStr = date.toISOString().split('T')[0];
                const isDone = (subTasks.dailyHabits[type] || []).includes(dateStr);
                const isToday = new Date().toISOString().split('T')[0] === dateStr;
                return (
                  <button
                    key={dateStr}
                    onClick={() => toggleHabit(type, dateStr)}
                    className={`w-8 h-8 mx-auto rounded-full text-[11px] font-bold transition-all flex items-center justify-center
                      ${isDone ? theme.active : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}
                      ${isToday && !isDone ? 'ring-2 ring-amber-400 ring-offset-2' : ''}
                    `}
                  >
                    {date.getDate()}
                  </button>
                );
              })}
            </div>
          </div>
        );
      };

      return (
        <div className="space-y-6 relative z-20">
          <div className="bg-white/80 backdrop-blur-xl border border-white rounded-3xl p-6 shadow-soft">
            <h3 className="font-extrabold text-lg text-slate-800 mb-4 flex items-center gap-2">
              <span className="text-amber-500 bg-amber-50 p-2 rounded-xl"><Icon name="Palette" size={20} /></span>
              ② 一人一作品（自由研究・工作）
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {subTasks.artProject.steps.map((step, idx) => (
                <label key={step.id} className={`flex items-center gap-3 p-4 rounded-2xl border cursor-pointer transition-colors ${
                  step.done ? 'bg-amber-50/50 border-amber-200 text-slate-400 line-through' : 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700 shadow-sm'
                }`}>
                  <input type="checkbox" checked={step.done} onChange={() => toggleArtStep(idx)} className="w-5 h-5 rounded text-amber-500 focus:ring-amber-400" />
                  <span className="text-sm font-bold">{step.label}</span>
                </label>
              ))}
            </div>
          </div>

          <div className="bg-white/80 backdrop-blur-xl border border-white rounded-3xl p-6 shadow-soft">
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-extrabold text-lg text-slate-800 flex items-center gap-2">
                <span className="text-blue-500 bg-blue-50 p-2 rounded-xl"><Icon name="BookOpenCheck" size={20} /></span>
                ③ 読書（何冊でも追加OK！）
              </h3>
              <span className="text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                計 {subTasks.books.filter(b => b.done).length} 冊 読破！
              </span>
            </div>
            
            <div className="space-y-3 mb-4">
              {subTasks.books.map((book, idx) => (
                <div key={book.id} className="flex items-center gap-3 bg-white p-2 rounded-2xl border border-slate-100 shadow-sm group">
                  <span className="text-xs font-bold text-slate-400 w-6 text-center">{idx + 1}.</span>
                  <input type="checkbox" checked={book.done} onChange={(e) => updateBook(book.id, 'done', e.target.checked)} className="w-5 h-5 rounded text-blue-500 cursor-pointer" />
                  <input type="text" value={book.title} onChange={(e) => updateBook(book.id, 'title', e.target.value)} placeholder={`読んだ本のタイトル`}
                    className={`flex-1 text-sm bg-transparent px-2 py-2 focus:outline-none focus:border-blue-500 transition-colors ${book.done ? 'line-through text-slate-400' : 'text-slate-800 font-bold'}`}
                  />
                  <button onClick={() => removeBook(book.id)} className="text-slate-300 hover:text-rose-500 px-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <Icon name="Trash2" size={16} />
                  </button>
                </div>
              ))}
            </div>
            
            <button onClick={addBook} className="w-full py-3 border-2 border-dashed border-blue-200 text-blue-500 font-bold rounded-2xl hover:bg-blue-50 transition-colors flex items-center justify-center gap-2">
              <Icon name="PlusCircle" size={18} /> 本を追加する
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {renderCalendar('④ 百人一首の音読', 'Sparkles', 'indigo', 'ondoku')}
            {renderCalendar('⑤ 家のお手伝い', 'HeartHandshake', 'rose', 'help')}
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. メインアプリケーション
    // ==========================================
    function App() {
      const [subjects, setSubjects] = useState(INITIAL_SUBJECTS);
      const [subTasks, setSubTasks] = useState(INITIAL_SUB_TASKS);
      const [reward, setReward] = useState('終わったらアイス！');
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showSettings, setShowSettings] = useState(false);
      const [activeTab, setActiveTab] = useState('drill'); // 'drill' or 'subtasks'
      const [isLoaded, setIsLoaded] = useState(false);
      
      const [isDragging, setIsDragging] = useState(false);
      const [showRewardModal, setShowRewardModal] = useState(false);

      // データ読み込み (キーを v6 に一新)
      useEffect(() => {
        const sd = localStorage.getItem('hw_v6_subj');
        const st = localStorage.getItem('hw_v6_subt');
        const sr = localStorage.getItem('hw_v6_rew');
        const ss = localStorage.getItem('hw_v6_snd');
        if (sd) try { setSubjects(JSON.parse(sd)); } catch (e) {}
        if (st) try { setSubTasks(JSON.parse(st)); } catch (e) {}
        if (sr) setReward(sr);
        if (ss !== null) setSoundEnabled(ss === 'true');
        setIsLoaded(true);
      }, []);

      // データ保存
      useEffect(() => {
        if (!isLoaded) return;
        localStorage.setItem('hw_v6_subj', JSON.stringify(subjects));
        localStorage.setItem('hw_v6_subt', JSON.stringify(subTasks));
        localStorage.setItem('hw_v6_rew', reward);
        localStorage.setItem('hw_v6_snd', String(soundEnabled));
      }, [subjects, subTasks, reward, soundEnabled, isLoaded]);

      const onTogglePage = useCallback((subject, type, page) => {
        setSubjects(prev => {
          const curr = prev[subject];
          const updated = curr.completedPages[type].includes(page)
            ? curr.completedPages[type].filter(p => p !== page) : [...curr.completedPages[type], page];
          return { ...prev, [subject]: { ...curr, completedPages: { ...curr.completedPages, [type]: updated } } };
        });
      }, []);

      const onSetPageStatus = useCallback((subject, type, page, status) => {
        setSubjects(prev => {
          const curr = prev[subject];
          const isDone = curr.completedPages[type].includes(page);
          if (isDone === status) return prev;
          const updated = status ? [...curr.completedPages[type], page] : curr.completedPages[type].filter(p => p !== page);
          return { ...prev, [subject]: { ...curr, completedPages: { ...curr.completedPages, [type]: updated } } };
        });
      }, []);

      useEffect(() => {
        const handleTouchMove = (e) => {
          if (!isDragging) return;
          const touch = e.touches[0];
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          if (el && el.dataset.page) {
            e.preventDefault();
            onSetPageStatus(el.dataset.subject, el.dataset.type, parseInt(el.dataset.page, 10), true);
          }
        };
        const handleEnd = () => setIsDragging(false);
        window.addEventListener('touchmove', handleTouchMove, { passive: false });
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('mouseup', handleEnd);
        return () => {
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('touchend', handleEnd);
          window.removeEventListener('mouseup', handleEnd);
        };
      }, [isDragging, onSetPageStatus]);

      const handleExport = () => {
        navigator.clipboard.writeText(JSON.stringify({ subjects, subTasks, reward }));
        alert('データをコピーしました！');
      };
      const handleImport = () => {
        const input = prompt('保存したバックアップ文字列を貼り付けてください:');
        if (input) {
          try {
            const parsed = JSON.parse(input);
            if (parsed.subjects) setSubjects(parsed.subjects);
            if (parsed.subTasks) setSubTasks(parsed.subTasks);
            if (parsed.reward) setReward(parsed.reward);
            alert('データを復元しました！'); setShowSettings(false);
          } catch (e) { alert('形式が正しくありません。'); }
        }
      };
      const handleReset = () => {
        if (window.confirm('チェックや記録をすべてリセットしますか？')) {
          setSubjects(INITIAL_SUBJECTS); setSubTasks(INITIAL_SUB_TASKS);
          localStorage.removeItem('hw_v6_subj'); localStorage.removeItem('hw_v6_subt');
          setShowSettings(false);
        }
      };

      if (!isLoaded) return null;

      const totalPages = Object.values(subjects).reduce((acc, s) => acc + s.totalPages, 0);
      const completedPages = Object.values(subjects).reduce((acc, s) => acc + s.completedPages.left.length + s.completedPages.right.length, 0);
      const totalPercentage = Math.round((completedPages / totalPages) * 100);
      const pacer = getPacerStatus(completedPages, totalPages);

      return (
        <main className="min-h-screen pb-24 font-sans text-slate-700 overflow-x-hidden relative">
          
          <header className="bg-white/80 backdrop-blur-xl sticky top-0 z-40 shadow-[0_4px_30px_rgba(0,0,0,0.03)] border-b border-white">
            <div className="max-w-4xl mx-auto py-4 px-5 flex justify-between items-center">
              <div>
                <h1 className="text-lg font-black tracking-tight text-slate-800">夏休み宿題進捗チェック</h1>
                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">Progress Checker</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2.5 rounded-full transition-colors ${soundEnabled ? 'bg-indigo-50 text-indigo-500' : 'bg-slate-100 text-slate-400'}`}>
                  <Icon name={soundEnabled ? "Volume2" : "VolumeX"} size={16} />
                </button>
                <button onClick={() => setShowSettings(!showSettings)} className="p-2.5 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors">
                  <Icon name="Settings" size={16} />
                </button>
              </div>
            </div>
          </header>

          <AnimatePresence>
            {showSettings && (
              <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} className="max-w-4xl mx-auto px-5 overflow-hidden">
                <div className="bg-slate-800 text-white rounded-2xl p-4 mt-4 shadow-lg flex flex-wrap items-center justify-between gap-3 text-xs">
                  <div className="flex items-center gap-2 font-bold"><Icon name="Database" size={16} className="text-blue-400" /><span>データのバックアップ</span></div>
                  <div className="flex items-center gap-2">
                    <button onClick={handleExport} className="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-xl border border-slate-600 font-bold">コピー</button>
                    <button onClick={handleImport} className="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-xl border border-slate-600 font-bold">復元</button>
                    <button onClick={handleReset} className="bg-rose-600 hover:bg-rose-500 px-3 py-2 rounded-xl font-bold ml-2 shadow-sm">初期化</button>
                  </div>
                </div>
              </motion.div>
            )}
          </AnimatePresence>

          <div className="max-w-4xl mx-auto px-5 mt-6 space-y-8">
            <div className="bg-white rounded-[2rem] p-8 shadow-soft relative overflow-hidden">
              <div className="absolute top-0 right-0 p-8 opacity-5 pointer-events-none"><Icon name="Target" size={120} /></div>
              <div className="relative z-10 flex flex-col md:flex-row justify-between md:items-end gap-6 mb-6">
                <div>
                  <h2 className="text-sm font-bold text-slate-400 tracking-widest mb-1 uppercase">Total Progress (①ドリル)</h2>
                  <div className="flex items-baseline gap-2">
                    <span className="text-5xl font-black text-slate-800 tracking-tighter">{completedPages}</span>
                    <span className="text-lg font-bold text-slate-400">/ {totalPages}</span>
                  </div>
                </div>
                {pacer.isQuotaMet && totalPercentage < 100 && (
                  <motion.button initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} onClick={() => setShowRewardModal(true)}
                    className="bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white shadow-lg shadow-orange-200 px-6 py-3 rounded-full font-bold text-sm flex items-center gap-2 active:scale-95 transition-transform"
                  >
                    <Icon name="Gift" size={18} /> 今日のノルマ達成！
                  </motion.button>
                )}
              </div>
              <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden mb-4">
                <motion.div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full" initial={{ width: '0%' }} animate={{ width: `${totalPercentage}%` }} transition={{ duration: 0.5 }} />
              </div>
              <div className={`text-xs px-4 py-3 rounded-xl border font-bold flex items-center justify-between shadow-sm ${pacer.color}`}>
                <span className="flex items-center gap-2"><Icon name="Activity" size={16} /> {pacer.text}</span>
                <span className="text-[11px] opacity-80">8/25 提出</span>
              </div>
            </div>

            <div className="px-2 flex items-center gap-3">
              <span className="bg-amber-100 text-amber-500 p-2 rounded-full"><Icon name="Flag" size={16} /></span>
              <input type="text" value={reward} onChange={(e) => setReward(e.target.value)} placeholder="目標のご褒美を入力"
                className="w-full bg-transparent border-b border-slate-200 focus:border-indigo-400 focus:outline-none text-sm font-bold text-slate-600 py-1 transition-colors"
              />
            </div>

            <div className="flex bg-slate-200/50 p-1.5 rounded-2xl relative z-20">
              <button onClick={() => { playSound('click', soundEnabled); setActiveTab('drill'); }} className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 rounded-xl transition-all ${activeTab === 'drill' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                <Icon name="BookOpen" size={18} /> ① ドリル
              </button>
              <button onClick={() => { playSound('click', soundEnabled); setActiveTab('subtasks'); }} className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 rounded-xl transition-all ${activeTab === 'subtasks' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                <Icon name="ListTodo" size={18} /> ②〜⑤ その他の課題
              </button>
            </div>

            <div className="relative z-20">
              {activeTab === 'drill' ? (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <SubjectCard data={subjects.math} isDragging={isDragging} setIsDragging={setIsDragging} onTogglePage={onTogglePage} onSetPageStatus={onSetPageStatus} soundEnabled={soundEnabled} />
                  <SubjectCard data={subjects.japanese} isDragging={isDragging} setIsDragging={setIsDragging} onTogglePage={onTogglePage} onSetPageStatus={onSetPageStatus} soundEnabled={soundEnabled} />
                  <SubjectCard data={subjects.science} isDragging={isDragging} setIsDragging={setIsDragging} onTogglePage={onTogglePage} onSetPageStatus={onSetPageStatus} soundEnabled={soundEnabled} />
                  <SubjectCard data={subjects.social} isDragging={isDragging} setIsDragging={setIsDragging} onTogglePage={onTogglePage} onSetPageStatus={onSetPageStatus} soundEnabled={soundEnabled} />
                </div>
              ) : (
                <SubTasksPanel subTasks={subTasks} setSubTasks={setSubTasks} soundEnabled={soundEnabled} />
              )}
            </div>
            
            <AnimatePresence>
              {totalPercentage === 100 && (
                <motion.div initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} exit={{ opacity: 0, scale: 0.8 }} className="pt-8 pb-4 text-center">
                  <button onClick={() => { playSound('fireworks', soundEnabled); launchFireworks(); }} className="bg-gradient-to-br from-purple-600 via-pink-500 to-orange-500 text-white font-black text-xl py-5 px-10 rounded-full shadow-[0_10px_40px_rgba(219,39,119,0.4)] hover:scale-105 active:scale-95 transition-all flex items-center gap-3 mx-auto">
                    <Icon name="PartyPopper" size={28} /> 全ての宿題が完了！
                  </button>
                  <p className="mt-4 text-sm font-bold text-slate-500">↑ クリックしてね！ ↑</p>
                </motion.div>
              )}
            </AnimatePresence>
          </div>

          <AnimatePresence>
            {showRewardModal && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={() => setShowRewardModal(false)} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <motion.div initial={{ scale: 0.9, y: 20 }} animate={{ scale: 1, y: 0 }} exit={{ scale: 0.9, y: 20 }} onClick={e => e.stopPropagation()} className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
                  <div className="text-6xl mb-4">🎉</div>
                  <h3 className="text-xl font-black text-slate-800 mb-2">今日のノルマ達成！</h3>
                  <p className="text-sm font-bold text-slate-500 mb-6">よくがんばりました！今日のご褒美は…</p>
                  <div className="bg-amber-50 text-amber-700 font-bold text-lg p-4 rounded-2xl border border-amber-100 mb-6">{reward}</div>
                  <button onClick={() => setShowRewardModal(false)} className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-700 transition-colors">閉じる</button>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
